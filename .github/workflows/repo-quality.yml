name: repo-quality

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Key scripts exist
        run: test -f filter_all.py && test -f README.md
      - run: python analytics/quality/check_module_parse.py
